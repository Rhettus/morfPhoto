services:
  morfphoto:
    environment:
      MORFPHOTO_CLIP_DIR: /clip
      MORFPHOTO_CLIP_THREADS: ${MORFPHOTO_CLIP_THREADS:-1}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MORFPHOTO_CLIP_BATCH_SIZE: ${MORFPHOTO_CLIP_BATCH_SIZE:-8}
      MORFPHOTO_CLIP_VISION_INT8: ${MORFPHOTO_CLIP_VISION_INT8:-0}
    volumes:
      - type: bind
        source: ${MORFPHOTO_CLIP_DIR:?Set MORFPHOTO_CLIP_DIR in .env}
        target: /clip
        bind:
          create_host_path: false
